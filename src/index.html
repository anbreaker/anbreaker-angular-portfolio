<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rootdevs | Creative Technologist & FullStack Web Master</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      content="Portfolio of Francisco Javier — Creative Technologist & FullStack Master, Engineering high-performance digital experiences with the right tools. High performance, low latency."
      name="description"
    />
    <link href="assets/images/favicon-64.webp" rel="icon" type="image/webp" />
    <link as="image" fetchpriority="high" href="assets/images/logo-260.webp" rel="preload" />
    <link
      as="font"
      crossorigin
      href="assets/fonts/caveat/caveat-latin.woff2"
      rel="preload"
      type="font/woff2"
    />
    <link
      as="font"
      crossorigin
      href="assets/fonts/inter-tight/inter-tight-latin.woff2"
      rel="preload"
      type="font/woff2"
    />
    <script>
      (function () {
        var langs = ['es', 'en', 'pt'];
        var lang = localStorage.getItem('portfolio-lang') || navigator.language.slice(0, 2);
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = '/assets/i18n/' + (langs.indexOf(lang) > -1 ? lang : 'en') + '.json';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
