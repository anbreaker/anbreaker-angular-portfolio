<!doctype html>
<!--
  Social preview card (og:image) for rootdevs.es. Regenerate public/assets/images/og-image.png with:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --allow-file-access-from-files \
    --screenshot=public/assets/images/og-image.png scripts/og-image/og-card.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rootdevs social card</title>
    <style>
      @font-face {
        font-family: 'Inter Tight';
        font-weight: 100 900;
        src: url('../../public/assets/fonts/inter-tight/inter-tight-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('../../public/assets/fonts/instrument-serif/instrument-serif-latin-italic.woff2')
          format('woff2');
      }

      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../public/assets/fonts/jetbrains-mono/jetbrains-mono-latin.woff2')
          format('woff2');
      }

      :root {
        --bg: #0a0a0b;
        --cyan: #22d3ee;
        --pink: #f43f5e;
        --text: #f4f4f5;
        --muted: #a1a1aa;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        height: 630px;
        overflow: hidden;
        width: 1200px;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 18% 30%, rgb(34 211 238 / 16%), transparent 45%),
          radial-gradient(circle at 82% 75%, rgb(244 63 94 / 18%), transparent 45%), var(--bg);
        color: var(--text);
        display: flex;
        font-family: 'Inter Tight', sans-serif;
        gap: 24px;
        padding: 64px 48px 64px 72px;
        position: relative;
      }

      .content {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 22px;
      }

      .logo {
        width: 210px;
      }

      .eyebrow {
        color: var(--cyan);
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.02;
      }

      h1 em {
        font-family: 'Instrument Serif', serif;
        font-weight: 400;
      }

      .role {
        background: linear-gradient(90deg, var(--cyan), var(--pink));
        background-clip: text;
        color: transparent;
        font-size: 36px;
        font-weight: 700;
      }

      .stack {
        color: var(--muted);
        font-size: 24px;
      }

      .url {
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        margin-top: 8px;
      }

      .photo {
        flex-shrink: 0;
        height: 440px;
        object-fit: cover;
        width: 440px;
      }
    </style>
  </head>
  <body>
    <main class="content">
      <img class="logo" alt="Rootdevs" src="../../public/assets/images/logoRootdevs.webp" />
      <p class="eyebrow">Portfolio &amp; blog</p>
      <h1>
        Francisco Javier
        <em>Antúnez</em>
      </h1>
      <p class="role">Senior Frontend Developer</p>
      <p class="stack">
        TypeScript · Angular · React · Vue · Lit · Astro
        <br />
        AI-assisted development
      </p>
      <p class="url">rootdevs.es</p>
    </main>
    <img class="photo" alt="" src="../../public/assets/images/fj.webp" />
  </body>
</html>
